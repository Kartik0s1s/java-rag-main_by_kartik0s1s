
# Application
spring.application.name=java-rag

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/ragdb
spring.datasource.username=kartik
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# RAG Configuration
rag.chunk.size=400
rag.chunk.overlap=100

# File Upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Local Ollama Configuration
ollama.base-url=http://localhost:11434
ollama.embedding-model=nomic-embed-text
ollama.chat-model=llama3.2:3b

# Embedding Configuration
rag.embedding.dimension=768

# Logging
logging.level.com.kartik.rag=DEBUG

# API Gateway Protections
security.api-key=
ratelimit.per-minute=60

# Vector Cache
vector.cache.enabled=true
vector.cache.ttl-seconds=300
